name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build every
# platform, the Windows installer, and publish a GitHub Release. The in-app
# updater downloads the assets below by name, so keep the names stable:
#   mail-rs-setup-windows-x64.exe          Windows installer
#   mail-rs-<platform>[.exe]               plain executables (portable / updater)
#   mail-rs-<tag>-<platform>.zip|.tar.gz   archives for manual download
#   SHA256SUMS.txt                         checksums (required by the updater)
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check-version:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Compare versions
        shell: bash
        run: |
          crate_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v${crate_version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${crate_version}"
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-runtime.ps1 -Executable target/${{ matrix.target }}/release/mail-rs.exe
      - name: Package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/mail-rs${{ matrix.exe }}"
          name="mail-rs-${TAG}-${{ matrix.name }}"
          mkdir -p "dist/${name}"
          cp "$bin" "dist/mail-rs-${{ matrix.name }}${{ matrix.exe }}"
          cp "$bin" README.md LICENSE "dist/${name}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = "${env:TAG}".TrimStart('v')
          $exe = Resolve-Path "target\${{ matrix.target }}\release\mail-rs.exe"
          $out = Resolve-Path dist
          & $iscc /Q "/DAppVersion=$version" "/DSourceExe=$exe" "/DOutputDir=$out" installer\mail.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Mail ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: dist/*
