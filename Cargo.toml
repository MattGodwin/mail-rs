[package]
name = "mail-rs"
version = "0.1.0"
edition = "2021"
description = "A fast, minimal, multi-account desktop email client that never modifies your mail"
repository = "https://github.com/MattGodwin/mail-rs"
readme = "README.md"
license = "MIT"

[dependencies]
eframe = "0.37"
imap = "2.4"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname"] }
mail-parser = "1"
keyring = "4"
rfd = "0.17"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html2text = "0.17"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
url = "2"
open = "5"
chrono = "0.4"
mime_guess = "2"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
notify-rust = "4"
semver = "1"
regex = "1"
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = "0.57"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
