[package]
name = "mail-rs"
version = "0.1.0"
edition = "2021"
description = "A fast, minimal, multi-account desktop email client that never modifies your mail"
repository = "https://github.com/MattGodwin/mail-rs"
readme = "README.md"
license = "MIT"

[dependencies]
eframe = "0.31"
imap = "2.4"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname"] }
mail-parser = "0.9"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
rfd = "0.15"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html2text = "0.12"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
url = "2"
open = "5"
chrono = "0.4"
mime_guess = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
anyhow = "1"
notify-rust = "4"
semver = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
